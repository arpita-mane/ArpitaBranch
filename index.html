<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        :root { --navy:#17324d; --blue:#3478db; --pale:#eef5ff; --text:#27364a; --muted:#718096; --border:#d8e1ed; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,sans-serif; color:var(--text); background:linear-gradient(135deg,#f7faff,var(--pale)); }
        .card { width:min(100%,420px); padding:40px; background:#fff; border-radius:18px; box-shadow:0 18px 45px rgba(23,50,77,.14); }
        .logo { width:48px; height:48px; display:grid; place-items:center; margin-bottom:22px; color:#fff; background:var(--blue); border-radius:12px; font-size:22px; font-weight:bold; }
        h1 { margin:0 0 8px; color:var(--navy); font-size:30px; }
        .intro { margin:0 0 28px; color:var(--muted); }
        label { display:block; margin:18px 0 8px; font-size:14px; font-weight:bold; }
        input[type=email], input[type=password] { width:100%; padding:13px 14px; border:1px solid var(--border); border-radius:8px; font-size:15px; outline:none; }
        input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(52,120,219,.15); }
        .options { display:flex; justify-content:space-between; align-items:center; margin:18px 0 25px; font-size:13px; }
        .remember { display:flex; align-items:center; gap:7px; margin:0; color:var(--muted); font-weight:normal; }
        .remember input { accent-color:var(--blue); }
        a { color:var(--blue); text-decoration:none; font-weight:bold; }
        button { width:100%; padding:14px; border:0; border-radius:8px; color:#fff; background:var(--blue); font-size:16px; font-weight:bold; cursor:pointer; }
        button:hover { background:#2867c2; }
        .signup { margin:25px 0 0; color:var(--muted); text-align:center; font-size:14px; }
        @media (max-width:480px) { .card { padding:30px 24px; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo" aria-hidden="true">B</div>
        <h1>Welcome Devops class</h1>
        <p class="intro">Sign in to continue to your account.</p>
        <form action="#" method="post">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <div class="options">
                <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <p class="signup">Don't have an account? <a href="#">Create one</a></p>
    </main>
</body>
</html>
